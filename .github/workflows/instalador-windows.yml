name: Instalador Windows

# Gera o instalador e publica em Releases quando o arquivo VERSION muda (ou manualmente).
on:
  push:
    branches: [main]
    paths: [VERSION, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
      - name: Testes
        shell: pwsh
        run: python -m unittest discover -s tests
      - name: Teste da interface (Qt de verdade, sem janela)
        shell: pwsh
        run: |
          python comandafacil_desktop.py --selftest shots-fonte
          Get-Content shots-fonte/selftest.txt
          if (-not (Select-String -Path shots-fonte/selftest.txt -Pattern "SELFTEST OK" -Quiet)) { throw "Autoteste da interface falhou" }
      - name: Versão
        id: v
        shell: pwsh
        run: echo "version=$((Get-Content VERSION).Trim())" >> $env:GITHUB_OUTPUT
      - name: Empacotar (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller installer/comandafacil.spec --noconfirm --distpath dist --workpath build
          if (-not (Test-Path dist/ComandaFacil/ComandaFacil.exe)) { throw "ComandaFacil.exe não foi gerado" }
      - name: Teste do programa empacotado
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist/ComandaFacil/ComandaFacil.exe -ArgumentList "--selftest","shots-exe" -Wait -PassThru
          if (Test-Path shots-exe/selftest.txt) { Get-Content shots-exe/selftest.txt }
          if ($p.ExitCode -ne 0) { throw "O programa empacotado falhou no autoteste (código $($p.ExitCode))" }
      - name: Guardar prints das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-do-pdv
          path: |
            shots-fonte/
            shots-exe/
          if-no-files-found: ignore
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer/comandafacil.iss
          if (-not (Test-Path dist/ComandaFacil-Setup.exe)) { throw "Instalador não foi gerado" }
      - name: Notas da versão e SHA-256
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $hash = (Get-FileHash dist/ComandaFacil-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ComandaFacil-Setup.exe" | Out-File -Encoding ascii dist/ComandaFacil-Setup.exe.sha256
          $notes = ""; $on = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^##\s+v?(\d+\.\d+\.\d+)') { $on = ($Matches[1] -eq $v); continue }
            if ($on) { $notes += $line + "`n" }
          }
          if (-not $notes.Trim()) { throw "CHANGELOG.md não tem a seção da versão $v. Escreva as novidades antes de lançar." }
          $notes += "`n---`nInstalador do ComandaFácil para Windows 10/11 (HelpTech). Quem já tem o programa instalado recebe o aviso de atualização dentro dele. Instalação nova: baixe `ComandaFacil-Setup.exe` e execute (se o SmartScreen avisar: Mais informações > Executar assim mesmo).`nSHA-256: $hash`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ComandaFácil ${{ steps.v.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/ComandaFacil-Setup.exe
            dist/ComandaFacil-Setup.exe.sha256
