<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cardápio digital</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f1ea;--ink:#1d1b16;--muted:#6b665a;--line:#ddd6c6;--card:#fffdf8;--brand:#d9480f;--brand-ink:#b23b0a;--ok:#1c6b4f;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--ink:#f1ede2;--muted:#a39d8d;--line:#332f25;--card:#1f1c15;--brand:#ff7a3d;--brand-ink:#ff9a68;--ok:#4fd1a1;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
header{padding:20px 16px 12px;max-width:720px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:.92rem}
.banner{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.banner.closed{border-color:var(--bad);color:var(--bad);font-weight:600}
main{max-width:720px;margin:0 auto;padding:0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;max-width:720px;margin:0 auto;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:1.1rem;margin:22px 0 8px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item b{display:block}.price{font-variant-numeric:tabular-nums;font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.add{border:0;border-radius:999px;background:var(--brand);color:#fff;font:600 1rem system-ui;min-width:44px;height:44px;cursor:pointer}
.qty button.minus{background:var(--line);color:var(--ink)}
.qty span{min-width:22px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);z-index:10}
.bar button{display:block;width:100%;max-width:720px;margin:0 auto;border:0;border-radius:12px;background:var(--brand);color:#fff;font:700 1.05rem system-ui;padding:14px;cursor:pointer;min-height:48px}
.bar button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;overflow:auto}
.sheet.open{display:block}
.panel{background:var(--bg);max-width:560px;margin:20px auto;border-radius:16px;padding:18px 16px 22px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;font-weight:500}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.seg input:checked+span{border-color:var(--brand);background:var(--brand);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--brand-ink);outline-offset:2px}
.row{display:flex;justify-content:space-between;padding:4px 0}
.total{font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.primary{width:100%;margin-top:16px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:700 1.05rem system-ui;padding:14px;cursor:pointer;min-height:48px}
.ghost{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:8px 0}
.steps{display:flex;gap:6px;margin:14px 0}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--ok)}
:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1 id="store-name">Cardápio</h1>
  <div class="muted" id="store-info"></div>
  <div class="banner" id="notice" hidden></div>
</header>
<nav class="chips" id="chips" aria-label="Categorias"></nav>
<main id="menu" aria-live="polite"><p class="muted">Carregando cardápio…</p></main>
<div class="bar"><button id="open-cart" disabled>Seu carrinho está vazio</button></div>

<div class="sheet" id="sheet-checkout" role="dialog" aria-modal="true" aria-labelledby="co-title"><div class="panel">
  <h2 id="co-title" style="margin-top:0">Finalizar pedido</h2>
  <div id="co-lines"></div>
  <div class="seg" role="radiogroup" aria-label="Como receber" style="margin-top:12px">
    <label><input type="radio" name="kind" value="entrega" checked><span>🛵 Entrega</span></label>
    <label><input type="radio" name="kind" value="retirada"><span>🏪 Retirar</span></label>
  </div>
  <label for="f-name">Seu nome</label><input id="f-name" autocomplete="name" maxlength="80">
  <label for="f-phone">WhatsApp / telefone com DDD</label><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">
  <div id="addr-wrap"><label for="f-addr">Endereço de entrega (rua, número, bairro)</label><input id="f-addr" autocomplete="street-address" maxlength="200"></div>
  <label for="f-pay">Pagamento (na entrega/retirada)</label>
  <select id="f-pay"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Vale-refeição</option></select>
  <div id="change-wrap" hidden><label for="f-change">Troco para quanto? (opcional)</label><input id="f-change" inputmode="decimal" placeholder="Ex.: 50,00"></div>
  <label for="f-note">Observações do pedido (opcional)</label><textarea id="f-note" rows="2" maxlength="200"></textarea>
  <div id="co-total"></div>
  <div class="err" id="co-err" role="alert"></div>
  <button class="primary" id="send">Enviar pedido</button>
  <button class="ghost" id="back">← Voltar ao cardápio</button>
</div></div>

<div class="sheet" id="sheet-status" role="dialog" aria-modal="true" aria-labelledby="st-title"><div class="panel">
  <h2 id="st-title" style="margin-top:0">Seu pedido</h2>
  <div id="st-body"></div>
  <button class="ghost" id="st-close">Fechar</button>
</div></div>

<script src="config.js"></script>
<script src="cardapio.js"></script>
</body>
</html>
