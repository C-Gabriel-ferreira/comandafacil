# Publicação com HTTPS automático (Caddy). Precisa de um domínio apontando para o servidor.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      COMANDAFACIL_SECRET_KEY: ${COMANDAFACIL_SECRET_KEY:?defina no arquivo .env}
      COMANDAFACIL_HTTPS: "1"
      COMANDAFACIL_BEHIND_PROXY: "1"
      COMANDAFACIL_PUBLIC_URL: ${COMANDAFACIL_PUBLIC_URL:-https://${DOMINIO}}
      COMANDAFACIL_GOOGLE_CLIENT_ID: ${COMANDAFACIL_GOOGLE_CLIENT_ID:-}
      COMANDAFACIL_GOOGLE_CLIENT_SECRET: ${COMANDAFACIL_GOOGLE_CLIENT_SECRET:-}
      COMANDAFACIL_SMTP_HOST: ${COMANDAFACIL_SMTP_HOST:-}
      COMANDAFACIL_SMTP_PORT: ${COMANDAFACIL_SMTP_PORT:-587}
      COMANDAFACIL_SMTP_USER: ${COMANDAFACIL_SMTP_USER:-}
      COMANDAFACIL_SMTP_PASSWORD: ${COMANDAFACIL_SMTP_PASSWORD:-}
      COMANDAFACIL_SMTP_FROM: ${COMANDAFACIL_SMTP_FROM:-}
      COMANDAFACIL_SMTP_SECURITY: ${COMANDAFACIL_SMTP_SECURITY:-starttls}
    volumes:
      - dados:/data          # banco, backups e chave — NÃO apague este volume
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina no arquivo .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
volumes:
  dados:
  caddy_dados:
